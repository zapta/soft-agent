[package]
name = "soft-agent"
version = "0.1.0"
edition = "2024"
description = "Experimental extensions to Logix Engine: the engine's MCP tools, plus tools of our own."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Logix Engine, used as a library: its tools, state, packages and catalog.
# Follows the engine's main branch; Cargo.lock records the commit used, and
# `cargo update -p logix-engine` moves it to the newest. To build
# against a local clone instead, see README.md, Engine version.
logix-engine = { git = "https://github.com/openlogix/logix-engine", branch = "main" }
# The same major versions as the engine, so the types we share with it
# (rmcp's model, schemars' schemas) are the same types.
clap = { version = "4", features = ["derive"] }
log = { version = "0.4", features = ["std"] }
rmcp = { version = "3.8", features = ["server", "transport-io"] }
schemars = { version = "1", features = ["indexmap2"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "net", "sync"] }
# For the debugger tools (src/debug), the engine's versions too.
hex = "0.4"
regex = "1"
serialport = { version = "4.10", default-features = false }
sha2 = "0.11"
tokio-util = "0.7"
toml = "0.9"

[profile.release]
strip = true

# From the engine's Cargo.toml (profiles of a dependency don't apply to the
# crate that uses it, so they are repeated here).
[profile.dev.package."*"]
debug = false

# QuickJS, which lays out the engine's diagrams, optimized even in debug
# builds (several times faster).
[profile.dev.package.rquickjs-sys]
opt-level = 3

[profile.dev.package.rquickjs-core]
opt-level = 3
