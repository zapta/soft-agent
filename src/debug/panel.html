<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Logix Debug Panel</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #e3e2de; --accent: #2f6fdb; --accent-text: #ffffff;
    --on: #1f9d55; --off: #8a8a84; --warn-bg: #fdecea; --warn: #a12a1f;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --text: #ecebe7; --muted: #9a9993;
      --line: #33332f; --accent: #5b8ff0; --accent-text: #0b0b0a;
      --on: #3ccf7a; --off: #6f6f6a; --warn-bg: #3a1d1a; --warn: #f2a59c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 20px;
    padding: 14px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
  }
  h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; }
  .meta b { color: var(--text); font-weight: 500; font-family: var(--mono); }
  .spacer { flex: 1; }
  main { padding: 16px 20px; display: grid; gap: 16px; max-width: 1100px; }
  section > h2 {
    margin: 0 0 8px; font-size: 16px; font-weight: 600;
    display: flex; align-items: baseline; gap: 10px;
  }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  tr:last-child td { border-bottom: none; }
  th + th, td + td { border-left: 1px solid var(--line); }
  thead th { border-bottom: 1px solid var(--line); }
  th.num { text-align: right; }
  th { font-weight: 500; color: var(--muted); font-size: 12px; }
  td.mono, .mono { font-family: var(--mono); }
  td.num { text-align: right; }
  #tip {
    position: fixed; z-index: 10; pointer-events: none; display: none;
    padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); font: 12px var(--mono);
    box-shadow: 0 2px 8px rgb(0 0 0 / .15); white-space: nowrap;
  }
  .bits { letter-spacing: .06em; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .pill.on { color: var(--on); border-color: var(--on); }
  .pill.off { color: var(--off); }
  button, input[type=text] {
    font: inherit; border-radius: 6px; border: 1px solid var(--line);
    background: var(--panel); color: var(--text); padding: 4px 10px;
  }
  input[type=text] { font-family: var(--mono); width: 9em; }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .controls { display: flex; gap: 6px; align-items: center; }
  #pause { min-width: 6.5em; }
  .paused-note { color: var(--muted); font-size: 13px; font-weight: 400; }
  h2 .meta { font-weight: 400; }
  #error {
    display: none; margin: 0; padding: 10px 14px; border-radius: 8px;
    background: var(--warn-bg); color: var(--warn); white-space: pre-wrap;
  }
  .empty { padding: 12px 14px; color: var(--muted); }
  select { font: inherit; }
</style>
</head>
<body>
<header>
  <h1>Logix Debug Panel</h1>
  <span class="meta">Session <select id="session"></select></span>
  <span class="meta">Board <b id="board">–</b></span>
  <span class="meta">Port <b id="port">–</b></span>
  <span class="meta">Build <b id="build">–</b></span>
  <span class="spacer"></span>
  <button id="pause" title="Stop or restart the live updates">Pause</button>
  <!-- Not round periods: a design's own periods, such as a blinky's half
       second, would otherwise show the same phase at every read. -->
  <select id="rate" title="Refresh rate">
    <option value="237">about 4 per second</option>
    <option value="973" selected>about 1 per second</option>
    <option value="4931">about every 5 s</option>
  </select>
  <button id="refresh">Read now</button>
</header>
<main>
  <p id="error"></p>
  <section>
    <h2>Drive</h2>
    <div class="card">
      <div class="scroll"><table id="drive">
        <thead><tr><th>Name</th><th class="num">Bits</th><th>Mode</th><th>State</th><th>Value</th></tr></thead>
        <tbody></tbody>
      </table></div>
      <div class="empty" id="no-drive" hidden>This build drives no nets.</div>
    </div>
  </section>
  <section>
    <h2>Watch <span class="meta" id="stamp"></span> <span class="paused-note" id="paused-note" hidden>Paused</span></h2>
    <div class="card">
      <div class="scroll"><table id="watch">
        <thead><tr><th>Name</th><th class="num">Bits</th><th class="num">Hex</th><th class="num">Decimal</th><th class="num">Binary</th></tr></thead>
        <tbody></tbody>
      </table></div>
      <div class="empty" id="no-watch" hidden>This build watches no nets.</div>
    </div>
  </section>
</main>
<script>
(() => {
  const params = new URLSearchParams(location.search);
  const token = params.get("t") || "";
  let session = params.get("session") || "";
  let built = "";      // the session and build the tables were made for
  let busy = false;
  let timer = null;
  let paused = false;
  const $ = (id) => document.getElementById(id);

  function api(path, opts = {}) {
    const sep = path.includes("?") ? "&" : "?";
    return fetch(`${path}${sep}t=${encodeURIComponent(token)}`, opts).then(async (r) => {
      const body = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(body.error?.message || `HTTP ${r.status}`);
      return body;
    });
  }

  function showError(e) {
    const el = $("error");
    if (!e) { el.style.display = "none"; el.textContent = ""; return; }
    el.textContent = e.message || String(e);
    el.style.display = "block";
  }

  function cell(text, cls) {
    const td = document.createElement("td");
    if (cls) td.className = cls;
    td.textContent = text;
    return td;
  }

  // The name, with the net's path as its hover text.
  function nameCell(name, net) {
    const td = cell(name, "name");
    td.dataset.net = net;
    return td;
  }

  // A decimal cell as wide as the net's largest value, so the column keeps
  // its width as the value changes (values over 53 bits show as "–").
  function decCell(width) {
    const td = cell("", "mono num dec");
    const digits = width <= 53 ? Math.ceil(width * Math.log10(2)) : 1;
    td.style.width = `calc(${Math.max(digits, 1)}ch + 30px)`;
    return td;
  }

  // The net's path, at once, next to the pointer (the browser's own title
  // text comes late or not at all).
  const tip = document.createElement("div");
  tip.id = "tip";
  document.body.append(tip);
  document.addEventListener("mouseover", (e) => {
    const td = e.target.closest?.("td.name");
    if (!td) { tip.style.display = "none"; return; }
    tip.textContent = td.dataset.net;
    tip.style.display = "block";
  });
  document.addEventListener("mousemove", (e) => {
    if (tip.style.display !== "block") return;
    const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
    tip.style.left = `${Math.max(8, x)}px`;
    tip.style.top = `${e.clientY + 16}px`;
  });

  function build(info) {
    const ib = $("watch").tBodies[0], ob = $("drive").tBodies[0];
    ib.replaceChildren(); ob.replaceChildren();
    for (const i of info.watch) {
      const tr = document.createElement("tr");
      tr.dataset.name = i.name;
      tr.append(nameCell(i.name, i.net), cell(String(i.width), "num"),
        cell("", "mono num hex"), decCell(i.width), cell("", "mono num bits"));
      ib.append(tr);
    }
    for (const o of info.drive) {
      const tr = document.createElement("tr");
      tr.dataset.name = o.name;
      const state = cell("");
      state.className = "state";
      const ctl = document.createElement("td");
      const box = document.createElement("div");
      box.className = "controls";
      if (o.width === 1) {
        for (const v of ["0", "1"]) {
          const b = document.createElement("button");
          b.textContent = v;
          b.title = `Drive ${o.name} to ${v}`;
          b.onclick = () => write({ name: o.name, value: Number(v) });
          box.append(b);
        }
      } else {
        const inp = document.createElement("input");
        inp.type = "text";
        inp.placeholder = "0x.., 0b.. or 12";
        const b = document.createElement("button");
        b.textContent = "Drive";
        b.className = "primary";
        const go = () => inp.value.trim() && write({ name: o.name, value: inp.value.trim() });
        b.onclick = go;
        inp.onkeydown = (e) => { if (e.key === "Enter") go(); };
        box.append(inp, b);
      }
      if (o.mode === "override") {
        const r = document.createElement("button");
        r.textContent = "Release";
        r.className = "release";
        r.title = `Give ${o.name} back to the design`;
        r.onclick = () => write({ name: o.name, release: true });
        box.append(r);
      }
      ctl.append(box);
      tr.append(nameCell(o.name, o.net), cell(String(o.width), "num"),
        cell(o.mode), state, ctl);
      ob.append(tr);
    }
    $("no-watch").hidden = info.watch.length > 0;
    $("no-drive").hidden = info.drive.length > 0;
  }

  function setText(td, text) {
    if (td.textContent !== text) td.textContent = text;
  }

  function render(state) {
    const info = state.info;
    const key = `${info.session}/${info.build_id}`;
    if (key !== built) { build(info); built = key; }
    $("board").textContent = info.board;
    $("port").textContent = info.port;
    $("build").textContent = info.build_id;
    for (const v of state.values) {
      const tr = $("watch").querySelector(`tr[data-name="${CSS.escape(v.name)}"]`);
      if (!tr) continue;
      setText(tr.querySelector(".hex"), v.hex);
      setText(tr.querySelector(".dec"), v.value === undefined || v.value === null ? "–" : String(v.value));
      setText(tr.querySelector(".bits"), v.bits);
    }
    for (const o of info.drive) {
      const tr = $("drive").querySelector(`tr[data-name="${CSS.escape(o.name)}"]`);
      if (!tr) continue;
      const td = tr.querySelector(".state");
      td.replaceChildren();
      const pill = document.createElement("span");
      pill.className = "pill " + (o.driven ? "on" : "off");
      pill.textContent = o.driven ? `driven ${o.hex}` : "released";
      td.append(pill);
      const rel = tr.querySelector(".release");
      if (rel) rel.disabled = !o.driven;
    }
    if (state.values.length) $("stamp").textContent = `read ${new Date().toLocaleTimeString()}`;
  }

  async function refresh(read = true) {
    if (busy || !session) return;
    busy = true;
    try {
      render(await api(`/api/state?session=${encodeURIComponent(session)}&read=${read ? 1 : 0}`));
      showError(null);
    } catch (e) {
      showError(e);
    } finally {
      busy = false;
    }
  }

  async function write(body) {
    try {
      await api("/api/write", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ session, ...body }),
      });
      showError(null);
    } catch (e) {
      showError(e);
    }
    refresh(!paused);
  }

  function schedule() {
    clearInterval(timer);
    if (!paused) timer = setInterval(() => refresh(true), Number($("rate").value));
  }

  async function sessions() {
    try {
      const { sessions } = await api("/api/sessions");
      const sel = $("session");
      sel.replaceChildren();
      for (const s of sessions) {
        const o = document.createElement("option");
        o.value = o.textContent = s;
        sel.append(o);
      }
      if (!sessions.includes(session)) session = sessions[0] || "";
      sel.value = session;
      if (!session) showError(new Error("No debug session is open. Open one with debug_open, then reload."));
    } catch (e) {
      showError(e);
    }
  }

  $("session").onchange = (e) => { session = e.target.value; built = ""; refresh(true); };
  $("pause").onclick = () => {
    paused = !paused;
    $("pause").textContent = paused ? "Resume" : "Pause";
    $("pause").classList.toggle("primary", paused);
    $("paused-note").hidden = !paused;
    schedule();
  };
  $("rate").onchange = schedule;
  $("refresh").onclick = () => refresh(true);

  sessions().then(() => { refresh(true); schedule(); });
})();
</script>
</body>
</html>
